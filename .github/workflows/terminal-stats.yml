name: Terminal Stats

on:
  schedule:
    - cron: "0 6 * * *"   # tiap jam 6 pagi UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: ${{ github.repository_owner }}
          theme: tokyonight
          headerStyle: mac
          hostname: archlinux
          commands: whoami,neofetch,languages,uptime,exit
          outputPath: assets/github_stats.svg
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update terminal stats [skip ci]" && git push)
