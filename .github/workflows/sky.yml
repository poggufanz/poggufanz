name: Contribution Sky

on:
  schedule:
    - cron: "0 0 * * *"   # tiap tengah malam UTC
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish to the output branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Draw the sky
        run: python3 .github/scripts/sky.py "$LOGIN" dist/contribution-sky.svg
        env:
          LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
